spring.application.name=auction-house

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/auction_house?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false

server.port=${SERVER_PORT:8080}

app.admin.name=${APP_ADMIN_NAME:System Administrator}
app.admin.email=${APP_ADMIN_EMAIL:admin@auctionhouse.com}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@123}

app.jwt.secret=${APP_JWT_SECRET:bXktc3VwZXItc2VjdXJlLWF1Y3Rpb24taG91c2Utand0LXNlY3JldC1rZXktMjAyNg==}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

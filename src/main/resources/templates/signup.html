<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Signup | Auction House</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css"/>
</head>
<body>
<div class="container narrow">
    <div class="spotlight">
        <h2>Create Your Account</h2>
        <p>Join as buyer or seller and start participating in curated auctions.</p>
    </div>

    <div class="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form th:action="@{/signup}" th:object="${signupRequest}" method="post" style="margin-top: 12px;">
        <label>Full Name</label>
        <input type="text" th:field="*{fullName}" required/>
        <p class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>

        <label>Email</label>
        <input type="email" th:field="*{email}" required/>
        <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

        <label>Password</label>
        <input type="password" th:field="*{password}" required/>
        <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

        <label>Role</label>
        <select th:field="*{role}" required>
            <option value="">Select role</option>
            <option th:each="role : ${roles}" th:value="${role}" th:text="${role}"></option>
        </select>

        <label>Phone</label>
        <input type="text" th:field="*{phone}"/>

        <label>Address</label>
        <input type="text" th:field="*{address}"/>

        <label>Company Name (Seller only)</label>
        <input type="text" th:field="*{companyName}"/>

        <button class="btn" type="submit">Create Account</button>
    </form>

    <p class="auth-footer">Already have an account? <a th:href="@{/login}">Login</a></p>
</div>
</body>
</html>

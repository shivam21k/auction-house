<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Seller Dashboard | Auction House</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css"/>
</head>
<body>
<div class="container dashboard-shell">
    <div class="topbar">
        <div>
            <h2>Seller Dashboard</h2>
            <p class="muted">Submit products, reserve slots, monitor approvals, and join live bidding.</p>
        </div>
        <div class="row">
            <a class="btn" th:href="@{/buyer/dashboard}">Live Bid Board</a>
            <a class="btn btn-secondary" th:href="@{/seller/profile}">My Profile</a>
            <form th:action="@{/logout}" method="post"><button class="btn btn-secondary" type="submit">Logout</button></form>
        </div>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="grid-2">
        <div class="panel">
            <h3>Add Product for Approval</h3>
            <form th:action="@{/seller/products}" th:object="${productRequest}" method="post">
                <label>Title</label>
                <input type="text" th:field="*{title}" required/>
                <p class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>

                <label>Description</label>
                <textarea th:field="*{description}" required></textarea>
                <p class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>

                <label>Category</label>
                <input type="text" th:field="*{category}"/>

                <label>Base Price</label>
                <input type="number" step="0.01" th:field="*{basePrice}" required/>

                <label>Reserve Price</label>
                <input type="number" step="0.01" th:field="*{reservePrice}"/>

                <label>Requested Slot Start</label>
                <input type="datetime-local" th:field="*{requestedSlotStart}" required/>

                <label>Requested Slot End</label>
                <input type="datetime-local" th:field="*{requestedSlotEnd}" required/>

                <button class="btn" type="submit">Submit Listing</button>
            </form>
        </div>

        <div class="spotlight">
            <h3>Seller Profile Snapshot</h3>
            <p><strong>Name:</strong> <span th:text="${seller.fullName}"></span></p>
            <p><strong>Email:</strong> <span th:text="${seller.email}"></span></p>
            <p><strong>Phone:</strong> <span th:text="${seller.phone}"></span></p>
            <p><strong>Company:</strong> <span th:text="${seller.companyName}"></span></p>
            <a class="btn" th:href="@{/seller/profile}" style="margin-top: 8px;">Open Full Profile</a>
        </div>
    </div>

    <h3 class="section-title">My Products</h3>
    <div class="table-wrap">
        <table>
            <tr><th>Title</th><th>Base Price</th><th>Status</th><th>Requested Slot</th></tr>
            <tr th:each="product : ${products}">
                <td th:text="${product.title}"></td>
                <td th:text="${product.basePrice}"></td>
                <td><span class="status" th:classappend="' status-' + ${product.status}" th:text="${product.status}"></span></td>
                <td th:text="${product.requestedSlotStart + ' to ' + product.requestedSlotEnd}"></td>
            </tr>
        </table>
    </div>
</div>
</body>
</html>

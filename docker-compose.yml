version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: auctionhouse-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: auction_house
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: auctionhouse-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auction_house?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_ADMIN_NAME: System Administrator
      APP_ADMIN_EMAIL: admin@auctionhouse.com
      APP_ADMIN_PASSWORD: Admin@123
      APP_JWT_SECRET: bXktc3VwZXItc2VjdXJlLWF1Y3Rpb24taG91c2Utand0LXNlY3JldC1rZXktMjAyNg==
      APP_JWT_EXPIRATION_MS: 86400000

volumes:
  mysql_data:
